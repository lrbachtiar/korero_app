[package]
name = "korero"
version = "0.1.0"
description = "Korero — local meeting transcription for macOS"
authors = ["Luqman Bachtiar <lrbachtiar@gmail.com>"]
edition = "2021"

[[bin]]
name = "Korero"
path = "src/main.rs"

[lib]
name = "korero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
keyring = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
